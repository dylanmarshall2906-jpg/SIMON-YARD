<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yard Stocking</title><style>body{font:16px system-ui;background:#f3f5f4;color:#17231d;margin:0}header{background:#175d38;color:white;padding:18px}main{max-width:720px;margin:auto;padding:14px}input,select,button{font:inherit;padding:12px;border-radius:9px;border:1px solid #aaa}input{box-sizing:border-box;width:100%}select{width:100%;margin-top:9px}button{cursor:pointer;background:white;color:#000!important;-webkit-text-fill-color:#000}.summary{display:flex;gap:8px;margin:12px 0}.summary div{flex:1;background:white;padding:12px;text-align:center;border-radius:10px}.summary b{display:block;font-size:24px}.tabs{display:flex;gap:5px;overflow:auto;margin:12px 0}.tabs button{padding:8px;white-space:nowrap}.tabs .active{background:#b6dfc6;color:#000!important}.item{background:white;border-radius:12px;padding:12px;margin:8px 0;box-shadow:0 1px 3px #0001}.item strong{display:block}.sub{font-size:13px;color:#536159;margin:5px 0 10px}.actions{display:flex;gap:8px}.actions button{flex:1;font-size:14px}.needs{background:#fff0c7!important}.done{background:#ccebd8!important}h3{margin:22px 0 8px}.footer{font-size:12px;color:#536159;padding:20px 0}#export{width:100%;margin-top:12px}</style><header><h2 style="margin:0">Yard Stocking Checklist</h2><small>Offline-ready local checklist · Partial SKU search</small></header><main><div class="summary"><div><b id="needs">0</b>Needs work</div><div><b id="done">0</b>Completed</div><div><b id="clear">0</b>Cleared</div></div><input id="q" placeholder="Search SKU, dimensions, material..." autocomplete="off"><select id="section"><option value="">All yard sections</option></select><div class="tabs" id="tabs"></div><div id="results"></div><button id="export">Copy stocking report</button><div class="footer">Saved locally in this browser on this device. Do not clear browser site data. Not shared with coworkers. The source list may be incomplete; verify stocking locations and quantities.</div></main><script>
const sections=[];function add(section,rows){rows.forEach(([name,detail='',sku=''])=>sections.push({id:section+'|'+name,section,name,detail,sku}))}
add('Treated & CedarTone', [['1x8-6 TR','Slide capacity: 84'],['2x2-8 TR','Slide capacity: 192'],['2x8-10 TR','Slide capacity: 96'],['2x12-10 TR','Slide capacity: 20'],['2x8-12 TR','Slide capacity: 72'],['6x6-12 TR','Slide capacity: 16'],['2x6-20 TR','Slide capacity: 40'],['2x10-10 CtN','Slide capacity: 40'],['2x8-10 CtN','Slide capacity: 48'],['12 Decking CtN','Slide capacity: 80'],['2x8-12 CtN','Slide capacity: 48'],['14 Decking CtN','Slide capacity: 80']]);
add('Construction Lumber',[['2x4-8','Barette (2)'],['2x4-8 P','Douglas (3), Riverside (2)'],['2x4-104 5/8','Sun'],['2x6-92 5/8','Potlatch'],['2x6-10 CDR','Idaho'],['4x4-8 White','Biewer'],['1x6-16 Strd','Idaho'],['1x6-12 CDR','Delta'],['2x10-16','Potlatch'],['2x2-8 Furring','Domtar']]);
add('Pipe Wall',[['1-1/2x10 Solid (3)','','6899930'],['6x10 Solid','','6899724'],['3x10 Prf','','6899611'],['4x10 Prf (2)','','6899736'],['4x10 White Sewer','','6899778'],['4x10 Green Sewer','','6899710']]);
add('Miscellaneous',[['2x2-36 Treated','','1113404'],['2x2-42 Treated','','1113572'],['2x2-36 Cedar','','1072299'],['2x2-42 CtN','','1116440'],['2, 4, 5 Step Stringer TR Pallet'],['Brown Rubber Nuggets (2)'],['Red Rubber Nuggets (1)'],['Gold-Colored Mulch (1)'],['120 Emerald Green ProRib (2)'],['192 Emerald Green ProRib'],['Assortment Black ProRib'],['1x2-16 SmartSiding']]);
const aisles=[['1A','2492 2485 2495 2480 2681 2683 2687 3760 3762 3761 2634 2605',''],['1B','2772 2773 2770 2771 2774 2776 2777 2925 2924 2923 2920 2919 2918 2303 2332 2476 2475',''],['2A','2781 2780 2779 2778 2740 3145 3147 3149 3148 3146 3144 3049 3046 3045 3047','2778'],['2B','1963 3028 3076 3124 3069 3099 3075 3058 3143 3142 3141 3142',''],['3A','1069 1070 1071 1882 1884 1880 1874 1891 1355 1358 1354 1152 1153 1290 1288 1289','1884 1880 1354 1152'],['3B','1283 1281 1951 4137 1101 1127 1459 1401 1430',''],['4A','1210 1239 1312 1311 1310 5065 5064 5068 3782 3783 3784',''],['4B','3862 3861 3863 3860 3754 3753 3752 3759 3758 3757 3647 3649 3639 3650 3648 3640 3721 3722 3724 3731 3732 3734','3754 3753 3752 3758 3650 3648'],['5A','3865 3875 3872 3870 3873 3871 3765 3764 3763 3964 3966 3969 3965 3962 3959 3967','3865 3875 3872 3870 3873 3871 3764 3964 3966 3969'],['5B','4081 4085 4087 4084 4080 4083 4092',''],['6','4094 3614 3611 3951 3953 3930 3968 5800 5810 5682 5680 5681 5674 3503 3497 3499 3497 3493 4098 4093 4098 4088 4082 4089 4082','3930 5681']];
const counts={'3752':5,'3758':2,'3650':3,'3648':1,'3865':4,'3875':9,'3872':2,'3870':4,'3873':4,'3871':2,'3764':2,'3966':2,'3969':5,'3930':2};
for(const [aisle,skus,over] of aisles){for(const n of [...new Set(skus.split(' '))]){const has=over.split(' ').includes(n);add('Pavers & Blocks',[['179-'+n,`Aisle ${aisle} · ${has?'Overstock listed'+(counts[n]?' ('+counts[n]+')':''):'No overstock listed'}`,'179'+n]])}}
const $=id=>document.getElementById(id),norm=s=>String(s).toLowerCase().replace(/[%\s-]/g,'');let state={};try{state=JSON.parse(localStorage.getItem('yard-stock-v1')||'{}')}catch{}let filter='all';const sec=[...new Set(sections.map(x=>x.section))];for(const s of sec){const o=document.createElement('option');o.value=s;o.textContent=s;$('section').append(o)}
function set(id,value){if(state[id]===value)delete state[id];else state[id]=value;localStorage.setItem('yard-stock-v1',JSON.stringify(state));render()}
function render(){const counts={needs:0,done:0,clear:0};sections.forEach(x=>counts[state[x.id]||'clear']++);for(const k in counts)$(k).textContent=counts[k];$('tabs').replaceChildren();for(const [key,label] of [['all','All'],['needs','Needs work'],['done','Completed'],['clear','Cleared']]){let b=document.createElement('button');b.textContent=label;b.className=filter===key?'active':'';b.onclick=()=>{filter=key;render()};$('tabs').append(b)}$('results').replaceChildren();const q=norm($('q').value),s=$('section').value;let shown=sections.filter(x=>(!s||x.section===s)&&(filter==='all'||(state[x.id]||'clear')===filter)&&norm([x.name,x.sku,x.detail,x.section].join(' ')).includes(q));if(!shown.length){$('results').textContent='No matching products';return}for(const section of sec){const rows=shown.filter(x=>x.section===section);if(!rows.length)continue;let h=document.createElement('h3');h.textContent=section;$('results').append(h);for(const x of rows){let card=document.createElement('div');card.className='item';let title=document.createElement('strong');title.textContent=x.name;card.append(title);let d=document.createElement('div');d.className='sub';d.textContent=(x.sku&&!x.name.includes(x.sku)?'SKU '+x.sku+' · ':'')+x.detail;card.append(d);let a=document.createElement('div');a.className='actions';for(const [key,label] of [['needs','Needs work'],['done','Complete'],['clear','Clear']]){let b=document.createElement('button');b.textContent=label;if((state[x.id]||'clear')===key)b.className=key==='needs'?'needs':key==='done'?'done':'';b.onclick=()=>set(x.id,key);a.append(b)}card.append(a);$('results').append(card)}}}
$('q').oninput=render;$('section').onchange=render;$('export').onclick=async()=>{let out='YARD STOCKING REPORT\n'+new Date().toLocaleString()+'\n';for(const [key,label] of [['needs','NEEDS STOCKING'],['done','COMPLETED']])out+='\n'+label+'\n'+sections.filter(x=>state[x.id]===key).map(x=>x.name+' | '+x.detail).join('\n')+'\n';try{await navigator.clipboard.writeText(out);alert('Report copied')}catch{prompt('Copy report:',out)}};render();
</script></html>
